global:
  python_bin: python
  conda_env: tweezer
  repo_root: ../
  log_base_dir: ../logs/service_logs
  stop_services_on_exit: true
  slm_config_dir: ../SLM/slm_config
  slm_feature_config_dir: ../SLM/slm_config
  tracking_config_dir: ../Camera/tracking_config
  pin_config_path: ../Arduino/pin_config.json
  experiment_scripts_dir: ../ExperimentScripts
  monitoring_logs_dir: ../logs/monitoring_logs
  experiment_logs_dir: ../logs/experiment_logs

dashboard:
  # Window defaults
  default_viewport_width: 2560
  default_viewport_height: 1400
  
  # Layout proportions (percentages)
  layout:
    left_column_width: 0.16
    center_column_width: 0.42
    right_column_width: 0.42
    right_left_width: 0.45
    right_right_width: 0.55
  
  # Image display defaults
  image:
    default_display_scale: 1.0
    default_texture_size: [1024, 1024]
    point_selection_radius_px: 18.0
    default_slm_width: 1920
    default_slm_height: 1152
    default_point_intensity: 0.9
    
  # SLM display defaults
  slm:
    circle_color: [255, 0, 0, 255]  # RGBA
    circle_radius: 15.0
    circle_thickness: 2
    send_debounce_seconds: 0.0333  # 30 FPS
    
  # Monitoring defaults
  monitoring:
    default_metrics_history: 1000
    moving_average_window: 50
    default_interval_seconds: 1.0
    
  # UI dimensions
  dimensions:
    plot_height: 200
    hardware_window_height: 900
    image_metrics_window_height: 600
    slm_metrics_window_height: 300
    
  # Color scheme (RGBA)
  colors:
    hardware: [220, 80, 80, 255]
    image: [80, 200, 90, 255]
    slm: [230, 180, 60, 255]
    status_connected: [80, 220, 90, 255]
    status_disconnected: [220, 60, 60, 255]
    text_primary: [230, 230, 230, 255]
    text_secondary: [180, 180, 180, 255]
  
  # Affine transform fields
  affine_fields:
    - translate_x
    - translate_y
    - translate_z
    - rotate_x_deg
    - rotate_y_deg
    - rotate_z_deg
    - scale_x
    - scale_y
    - scale_z
    - shear_xy
    - shear_yz
    - shear_xz
services:
  arduino_grpc:
    enabled: true
    name: Arduino gRPC Server
    script_path: Hardware/main/arduino.sh
    python_script: Arduino/rpc/grpc_server_streaming.py
    cpu_list: 0,1
    restart_on_exit: true
    restart_delay: 5
    log_subdir: arduino_grpc_server
    args:
      serial_port: /dev/ttyACM0
      host: 0.0.0.0
      port: 50051
      baud: 2000000
      timeout: 0.3499999940395355
      max_workers: 2
      log_level: INFO
  image_server:
    enabled: true
    name: Image Server with Tracking
    script_path: Imaging/Acquisition/start_image_server.sh
    python_script: Camera/ImageServer_with_track.py
    cpu_list: 2-37
    restart_on_exit: true
    restart_delay: 5
    log_subdir: imaging/acquisition
    args:
      host: 0.0.0.0
      port: 50052
      max_workers: 8
      max_message_bytes: 16777216
      tracker_processes: 32
      tracker_backend: auto
      tile_width: 256
      tile_height: 256
      tile_overlap: 32
      track_diameter: 21
      track_separation: 18
      track_percentile: 14.0
      track_minmass: 100.0
      track_maxmass: 0.0
      track_pixel_threshold: 0.0
      track_preprocess: true
      track_lshort: 1
      track_llong: 21
    process_cpu_list: 2-37
    tracker_cpu_list: 2-33
    grpc_workers: 4
  save_compressed:
    enabled: true
    name: Save Compressed Images
    script_path: Imaging/Compression/start_save_compressed.sh
    python_script: Camera/save_compressed_server.py
    cpu_list: 38-53
    restart_on_exit: true
    restart_delay: 5
    log_subdir: imaging/save_compressed
    args:
      input: /path/to/input/directory
      output: /path/to/output/directory
      processes: 16
      max_images: null
      stability_seconds: 1.0
      quality: 100
      effort: 7
      decoding_speed: 0
      verbose: false
      cpu_affinity: 38-53
  slm_generator:
    enabled: true
    name: SLM Hologram Generator
    script_path: SLM/start_generator_service.sh
    python_script: SLM/slm-control-server/generator_service.py
    cpu_list: '54'
    restart_on_exit: true
    restart_delay: 5
    log_subdir: slm
    args:
      bind: 192.168.6.1:50053
      slm_target: 192.168.6.2:50051
      fire_and_forget: true
      width: 1920
      height: 1152
      iterations: 10
  ambient_telemetry:
    enabled: true
    name: Ambient Telemetry Server
    script_path: GUI/external_access/start_ambient_telemetry.sh
    python_script: GUI/external_access/ambient_telemetry_server.py
    cpu_list: '55'
    restart_on_exit: true
    restart_delay: 5
    log_subdir: ambient_telemetry
    args:
      logs_dir: ../logs/AutoLogs/Arduino_duo_server
      http_host: 0.0.0.0
      http_port: 9001
      page_size: 240
      log_level: INFO
