# Objective Temperature Controller Configuration
# This is an example configuration file showing all available settings

# Arduino Settings
arduino:
  port: COM4
  baudrate: 9600

# Telemetry Server
telemetry:
  url: http://10.0.63.195:9002
  timeout: 5.0

# PI Controller Settings
controller:
  setpoint: 25.0          # Initial temperature setpoint (°C)
  kp: 0.05                # Proportional gain
  ki: 0.01                # Integral gain
  deadband: 0.1           # Temperature tolerance ±°C
  pwm_min: 0.0            # Minimum PWM value
  pwm_max: 0.4            # Maximum PWM value (40%)
  mode_switch_delay: 10.0 # Minimum seconds between heating/cooling switches

# Control Loop
control:
  interval: 1.0           # Control loop interval (seconds)

# Logging
logging:
  dir: ./logs
  level: INFO             # DEBUG, INFO, WARNING, ERROR, CRITICAL

# HTTP Server
http:
  host: 0.0.0.0          # Bind to all interfaces
  port: 9003

# Notes:
# - To use this config, modify the script to load YAML (add PyYAML dependency)
# - Current implementation uses command-line arguments instead
# - This file serves as documentation of all configurable parameters
